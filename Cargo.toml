[package]
name = "ai-agent-monitor"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "AIAgentMonitor"
path = "src/main.rs"

[[test]]
name = "settings_pane"
path = "tests/settings_pane.rs"
harness = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
json5 = "1"
libc = "0.2"
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
tempfile = "3"
url = "2"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard", "NSAlert", "NSTabViewController", "NSTabView", "NSTabViewItem", "NSViewController", "NSToolbar", "NSPopUpButton", "NSSecureTextField", "NSAttributedString", "NSAppearance", "NSColorList", "NSAccessibility", "NSSwitch", "NSBezierPath", "NSAffineTransform", "NSGraphicsContext", "NSApplication", "NSAnimationContext", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSWindow", "NSScreen", "NSView", "NSEvent", "NSControl", "NSButton", "NSButtonCell", "NSImage", "NSTextField", "NSText", "NSImageView", "NSImageCell", "NSScrollView", "NSClipView", "NSCell", "NSTextFieldCell", "NSParagraphStyle", "NSMenu", "NSMenuItem", "NSBox", "NSUserInterfaceItemIdentification", "NSFont", "NSFontDescriptor", "objc2-core-foundation", "NSColor", "NSGraphics", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSPathUtilities", "NSAttributedString", "NSData", "NSUserDefaults", "NSArray", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString", "NSURL", "NSRunLoop", "NSTimer", "NSDate", "NSDateFormatter", "NSNotification", "NSDistributedNotificationCenter", "NSIndexSet", "block2"] }
objc2-user-notifications = { version = "0.3", features = ["block2"] }

[profile.release]
lto = true
strip = true
