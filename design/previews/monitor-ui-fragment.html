<script>

  const root = document.getElementById('aam-ui-preview');

    if (!saved?.privateContent?.expanded) return;

      const ids = saved.privateContent.expanded[stage.dataset.layout];
      if (!Array.isArray(ids)) return;
      stage.querySelectorAll('.aam-session').forEach(article => {
        const expanded = ids.includes(article.dataset.session);
        article.classList.toggle('is-expanded', expanded);
        article.querySelectorAll('.aam-toggle, .aam-robot-open').forEach(button => button.setAttribute('aria-expanded', expanded));
      });
    });
  }
  function rememberExpanded() {
    if (!window.openai?.setWidgetState) return;
    const expanded = {};
    root.querySelectorAll('.aam-stage').forEach(stage => {
      expanded[stage.dataset.layout] = Array.from(stage.querySelectorAll('.aam-session.is-expanded'), article => article.dataset.session);
    });
    window.openai.setWidgetState({modelContent:null, privateContent:{expanded}}).catch(() => {});

    {id:'connection', app:'VS Code', title:'Восстановление соединения после перезапуска агента и синхронизация активных запросов', status:'working', message:'Повторное подключение проверено. Ожидающие запросы сохранили свои идентификаторы.', directory:'~/dev/ai-agent-monitor', branch:'fix/reconnect'},
    {id:'permissions', app:'VS Code', title:'Обработка разрешений для команд в терминале', status:'idle', message:'Подтверждение применяется только к текущему запросу. Повторная отправка защищена от дублирования.', directory:'~/dev/ai-agent-monitor', branch:'fix/permissions'},
    {id:'metrics', app:'Terminal', title:'Вернуться к метрикам', status:'working', message:'Сравниваю результаты замеров до и после изменения индексов.', directory:'~/demo/metrics-service', branch:'feature/metrics'},
    {id:'processes', app:'Terminal', title:'Проверь запущенные процессы', status:'idle', message:'Лишних процессов нет. Монитор работает в одном экземпляре.', directory:'~/dev/ai-agent-monitor', branch:'main'},
    {id:'restore', app:'Codex', title:'Восстановление приложения', status:'idle', message:'Сохранение состояния работает. Следующий запуск восстановит открытые документы.', directory:'~/demo/desktop-workspace', branch:'main'},
    {id:'cargo', app:'Codex', title:'Настроить локальный Cargo.lock', status:'idle', message:'Зависимости зафиксированы. Сборка воспроизводится с локальным Cargo.lock.', directory:'~/dev/ai-agent-monitor', branch:'main'}
  ];
  const questions = [
    {title:'Какие проверки запустить?', choices:['Только изменённые модули','Весь набор тестов']},
    {title:'Куда отправить результат?', choices:['В этот чат','В pull request']}
  ];
  const status = s => {
    if (s.status === 'idle') return '';
    const [symbol, label] = s.status === 'working' ? ['refresh-cw', 'Working'] : s.status === 'finished' ? ['circle-check', 'Finished (unseen)'] : ['circle-alert', 'Needs response'];
    return `<span class="aam-state" data-status="${s.status}" aria-label="${label}">${icon(symbol)}<span class="aam-state-label">${label}</span></span>`;
  };
  function questionForm(prefix) {
    return `<form class="aam-question aam-question-form"><span class="aam-request-mark" aria-hidden="true">${icon('circle-alert')}</span>${questions.map((q, index) => `<fieldset><legend class="aam-question-title">${q.title}</legend>${q.choices.map((answer, i) => `<label class="aam-answer"><input type="radio" name="${prefix}-q${index}" value="${escape(answer)}" ${i === 0 ? 'checked' : ''}><span class="aam-answer-text">${answer}</span></label>`).join('')}<label class="aam-answer"><input type="radio" name="${prefix}-q${index}" value="custom" aria-label="Свой ответ на вопрос: ${q.title}"><input class="aam-custom" type="text" placeholder="Your own answer" aria-label="Свой ответ на вопрос: ${q.title}"></label></fieldset>`).join('')}<button class="aam-action aam-primary aam-send cursor-interaction" type="submit">Send answer</button></form>`;
  }
  function sessionMarkup(s, prefix) {
    const request = s.request === 'approval' ? `<div class="aam-question aam-approval"><span class="aam-request-mark" aria-hidden="true">${icon('circle-alert')}</span><p class="aam-question-title">Разрешить запуск полного набора тестов?</p><p class="aam-command-caption">Command</p><pre class="aam-command"><code>cargo test --locked --workspace</code></pre><p class="aam-command-caption">Allow similar commands</p><pre class="aam-command"><code>Future commands starting with: cargo test</code></pre><div class="aam-actions"><button type="button" class="aam-action aam-primary cursor-interaction" data-action="allow">Allow once</button><button type="button" class="aam-action aam-subtle cursor-interaction" data-action="allow">Allow similar commands</button><button type="button" class="aam-action aam-subtle cursor-interaction" data-action="deny">Deny</button></div></div>` : s.request === 'questions' ? questionForm(prefix) : '';
    return `<article class="aam-session ${s.id === 'delivery' ? 'is-expanded' : ''}" data-session="${s.id}" data-status="${s.status}"><div class="aam-row"><span class="aam-group-marker"><button type="button" class="aam-robot-open cursor-interaction" aria-label="Раскрыть ${s.title}" aria-expanded="${s.id === 'delivery'}" data-tooltip="Свернуть / раскрыть сеанс"><span class="aam-session-mark" aria-hidden="true"></span></button></span><button type="button" class="aam-open cursor-interaction" aria-label="Перейти в ${s.app}: ${s.title}" data-tooltip="Перейти в ${s.app}">${s.title}</button><span class="aam-state-slot">${status(s)}</span><button type="button" class="aam-toggle cursor-interaction" aria-label="Раскрыть ${s.title}" aria-expanded="${s.id === 'delivery'}">${icon('chevron-right')}</button></div><div class="aam-detail"><div class="aam-clip"><div class="aam-detail-content"><div class="aam-messages"><div class="aam-history" hidden><p class="aam-message">${s.history || 'Проверил структуру проекта и подготовил изменения.'}</p></div><button type="button" class="aam-previous cursor-interaction" aria-label="Показать предыдущее сообщение">${icon('chevron-up')}</button><div class="aam-message aam-latest"><span class="aam-message-dot" aria-hidden="true"></span>${s.id === 'delivery' ? s.message : `<p>${s.message}</p>`}</div></div>${request}<div class="aam-meta"><div class="aam-meta-line">${icon('folder')}<span data-tooltip="${s.directory}">${s.directory}</span></div><div class="aam-meta-line">${icon('git-branch')}<span>${s.branch}</span></div></div></div></div></div></article>`;
  }
  function build(stage, index) {
    let paused = false;
    const live = sessions.map(s => ({...s}));
    const product = document.createElement('div');
    product.className = 'aam-product';
    product.setAttribute('aria-label', 'AI Agent Monitor — ' + stage.parentElement.dataset.variant);
    product.innerHTML = `<div class="aam-bar"><small>Sat 10:42</small><span class="aam-status-item" aria-label="AI Agent Monitor"><span class="aam-robot" style="mask-image:url(${robot})" aria-hidden="true"></span><span class="aam-working-count">2</span><span class="aam-count aam-finished-count" aria-label="Unseen finished sessions">2</span><span class="aam-count aam-request-count" aria-label="Pending requests">2</span></span></div><div class="aam-menu"><div class="aam-list">${['VS Code','Terminal','Codex'].map(app => `<section class="aam-group" data-app="${app}" aria-label="${app}"><div class="aam-sticky-app"><span class="aam-app-icon" role="img" aria-label="${app}" data-tooltip="${app}"><img src="${applicationIcons[app]}" width="24" height="24" alt=""></span></div><div class="aam-group-sessions">${live.filter(s => s.app === app).map(s => sessionMarkup(s, index + '-' + s.id)).join('')}</div></section>`).join('')}</div><footer class="aam-footer"><div class="aam-usage"><span>Codex Weekly</span><span class="aam-usage-values"><span>74%</span><span>Nov 7</span></span></div><div class="aam-footer-bottom"><span class="aam-version" aria-live="polite">v0.1.0 · preview</span><div class="aam-tools"><button type="button" class="aam-icon-button aam-settings-button cursor-interaction" aria-label="Settings" aria-expanded="false">${icon('settings')}</button><button type="button" class="aam-icon-button aam-power cursor-interaction" aria-label="Pause monitor" aria-pressed="false">${icon('power')}</button></div></div><div class="aam-settings" hidden><strong>General</strong><label><input type="checkbox" checked>Launch at login</label><label><input type="checkbox" checked>Menu bar animation</label><label><input class="aam-show-meta" type="checkbox" checked>Show folder and branch</label></div></footer></div>`;
    stage.append(product);
    // Keep the application icon centered on the first header; robots scroll beneath it.
    function syncGutter() {
      product.querySelectorAll('.aam-group').forEach(group => {
        const sticky = group.querySelector('.aam-sticky-app');
        const header = group.querySelector('.aam-row');
        sticky.style.height = header.getBoundingClientRect().height + 'px';
        group.querySelectorAll('.aam-row').forEach(row => {
          const title = row.querySelector('.aam-open').getBoundingClientRect();
          const article = row.closest('.aam-session');
          const headerHeight = row.getBoundingClientRect().height;
          article.style.setProperty('--aam-header-height', headerHeight + 'px');
          const articleBox = article.getBoundingClientRect();
          const lineTop = articleBox.top + headerHeight / 2 + 5.8;
          const lineX = articleBox.left + parseFloat(getComputedStyle(stage).getPropertyValue('--aam-inset')) + 5.5;
          const cuts = Array.from(article.querySelectorAll('.aam-request-mark, .aam-message-dot'))
            .filter(mark => mark.getClientRects().length && getComputedStyle(mark).display !== 'none')
            .map(mark => {
              if (mark.classList.contains('aam-message-dot')) { const box = mark.getBoundingClientRect(); return {top: box.top + .1, bottom: box.bottom - .1}; }
              const svg = mark.querySelector('svg');
              if (!svg) return null;
              const box = svg.getBoundingClientRect();
              const shapes = Array.from(svg.querySelectorAll('path, circle, rect, line, polyline, polygon, ellipse'))
                .map(shape => ({shape, matrix: shape.getScreenCTM()?.inverse()}))
                .filter(item => item.matrix && typeof item.shape.isPointInStroke === 'function');
              let top = null, bottom = null;
              // Sample the actual rendered strokes at the thread's x position,
              // including the SVG's real scale and any child transforms.
              for (let y = box.top; y <= box.bottom; y += .05) {
                const point = new DOMPoint(lineX, y);
                if (shapes.some(({shape, matrix}) => shape.isPointInStroke(point.matrixTransform(matrix)))) {
                  if (top === null) top = y;
                  bottom = y;
                }
              }
              return top === null ? null : {top: top + .1, bottom: bottom - .1};
            })
            .filter(box => box && box.bottom > lineTop)
            .sort((a, b) => a.top - b.top);
          const stops = ['#000 0px'];
          for (const box of cuts) {
            const start = Math.max(0, box.top - lineTop);
            const end = Math.max(start, box.bottom - lineTop);
            stops.push(`#000 ${start}px`, `transparent ${start}px`, `transparent ${end}px`, `#000 ${end}px`);
          }
          stops.push('#000 100%');
          article.style.setProperty('--aam-thread-mask', `linear-gradient(to bottom, ${stops.join(', ')})`);
          row.style.setProperty('--aam-title-highlight-width', title.right - row.getBoundingClientRect().left - 29 + 12 + 'px');
        });
      });
    }
    const gutterIcons = new MutationObserver(syncGutter);
    gutterIcons.observe(product, {childList: true, subtree: true});
    const gutterResize = new ResizeObserver(syncGutter);
    product.querySelectorAll('.aam-group-sessions').forEach(group => gutterResize.observe(group));
    requestAnimationFrame(syncGutter);
    let pointerPosition = null;
    function updatePreviousHover() {
      product.querySelectorAll('.aam-messages').forEach(messages => {
        const previous = messages.querySelector('.aam-previous');
        const history = messages.querySelector('.aam-history');
        const first = history.hidden ? messages.querySelector('.aam-latest') : history.querySelector('.aam-message');
        const box = first.getBoundingClientRect();
        const origin = messages.getBoundingClientRect();
        previous.style.top = box.top - origin.top + 'px';
        previous.style.height = box.height + 'px';
        const expanded = messages.closest('.aam-session').classList.contains('is-expanded');
        messages.classList.toggle('is-first-message-hovered', expanded && pointerPosition !== null && pointerPosition.y >= box.top && pointerPosition.y < box.bottom);
      });
    }
    product.addEventListener('pointermove', event => {
      pointerPosition = {y: event.clientY};
      updatePreviousHover();
    });
    product.addEventListener('pointerleave', () => {
      pointerPosition = null;
      updatePreviousHover();
    });
    product.querySelector('.aam-list').addEventListener('scroll', updatePreviousHover, {passive:true});
    function recount() {
      const pending = live.filter(s => s.status === 'request').length;
      product.querySelector('.aam-request-count').textContent = pending;
      product.querySelector('.aam-request-count').hidden = !pending;
      product.querySelector('.aam-working-count').textContent = live.filter(s => s.status === 'working').length;
      product.querySelector('.aam-working-count').hidden = !live.some(s => s.status === 'working');
      const finished = live.filter(s => s.status === 'finished').length;
      product.querySelector('.aam-finished-count').textContent = finished;
      product.querySelector('.aam-finished-count').hidden = !finished;
    }
    function acknowledgeFinished(article) {
      const session = live.find(s => s.id === article?.dataset.session);
      if (session?.status !== 'finished') return;
      session.status = 'idle';
      article.dataset.status = 'idle';
      article.querySelector('.aam-state-slot').innerHTML = '';
      recount();
    }
    function finish(article, approved) {
      if (article.querySelector('.aam-question').contains(document.activeElement)) document.activeElement.blur();
      const s = live.find(s => s.id === article.dataset.session);
      s.status = approved ? 'working' : 'idle';
      article.dataset.status = s.status;
      article.querySelector('.aam-question').hidden = true;
      article.querySelector('.aam-state-slot').innerHTML = status(s);
      const latest = article.querySelector('.aam-latest');
      const dot = latest.querySelector('.aam-message-dot');
      latest.textContent = approved ? 'Ответ отправлен. Продолжаю работу.' : 'Запуск отменён. Жду следующей команды.';
      latest.prepend(dot);
      recount();
      if (globalThis.lucide) lucide.createIcons({attrs: {width:16,height:16}});
    }
    product.addEventListener('click', event => {
      const sessionAction = event.target.closest('.aam-toggle, .aam-robot-open, .aam-open, .aam-previous');
      if (sessionAction) acknowledgeFinished(sessionAction.closest('.aam-session'));
      const toggle = event.target.closest('.aam-toggle, .aam-robot-open');
      if (toggle) {
        const article = toggle.closest('.aam-session');
        const expanded = article.classList.toggle('is-expanded');
        article.querySelectorAll('.aam-toggle, .aam-robot-open').forEach(button => button.setAttribute('aria-expanded', expanded));
        toggle.setAttribute('aria-label', (expanded ? 'Свернуть ' : 'Раскрыть ') + live.find(s => s.id === article.dataset.session).title);
        rememberExpanded();
      }
      const open = event.target.closest('.aam-open');
      if (open) {
        const s = live.find(s => s.id === open.closest('.aam-session').dataset.session);
        product.querySelector('.aam-version').textContent = s.app + ' · ' + s.title;
      }
      const previous = event.target.closest('.aam-previous');
      if (previous) { const messages = previous.closest('.aam-messages'); messages.querySelector('.aam-history').hidden = false; previous.hidden = true; }
      const action = event.target.closest('[data-action]');
      if (action) finish(action.closest('.aam-session'), action.dataset.action === 'allow');
      const settings = event.target.closest('.aam-settings-button');
      if (settings) { const panel = product.querySelector('.aam-settings'); panel.hidden = !panel.hidden; settings.setAttribute('aria-expanded', !panel.hidden); }
      const power = event.target.closest('.aam-power');
      if (power) { paused = !paused; power.setAttribute('aria-pressed', paused); power.setAttribute('aria-label', paused ? 'Resume monitor' : 'Pause monitor'); product.querySelector('.aam-version').textContent = paused ? 'Monitor paused' : 'v0.1.0 · preview'; }
    });
    product.addEventListener('input', event => {
      if (event.target.matches('.aam-custom')) {
        event.target.setCustomValidity('');
        event.target.closest('.aam-answer').querySelector('input[type="radio"]').checked = true;
      }
    });
    product.addEventListener('change', event => {
      if (event.target.matches('.aam-show-meta')) product.querySelectorAll('.aam-meta').forEach(meta => meta.hidden = !event.target.checked);
      if (event.target.matches('input[type="radio"]')) event.target.closest('fieldset').querySelector('.aam-custom').setCustomValidity('');
    });
    product.addEventListener('submit', event => {
      event.preventDefault();
      const form = event.target;
      let valid = true;
      form.querySelectorAll('fieldset').forEach(fieldset => {
        const selected = fieldset.querySelector('input[type="radio"]:checked');
        const custom = fieldset.querySelector('.aam-custom');
        custom.setCustomValidity('');
        if (!selected || (selected.value === 'custom' && !custom.value.trim())) { custom.setCustomValidity('Введите свой ответ или выберите вариант.'); custom.reportValidity(); valid = false; }
      });
      if (valid) finish(form.closest('.aam-session'), true);
    });
    product.addEventListener('keydown', event => {
      const editing = event.target.matches('input[type="text"]');
      if (event.key === 'Enter' && editing) {
        event.preventDefault();
        event.target.closest('.aam-answer').querySelector('input[type="radio"]').checked = true;
        return;
      }
      if (event.key === 'Enter' && event.target.matches('input[type="radio"]')) {
        event.preventDefault();
        event.target.checked = true;
        event.target.dispatchEvent(new Event('change', {bubbles:true}));
        return;
      }
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        if (editing || !event.target.matches('.aam-open')) return;
        const article = event.target.closest('.aam-session');
        if (!article) return;
        event.preventDefault();
        const expanded = event.key === 'ArrowRight';
        article.classList.toggle('is-expanded', expanded);
        article.querySelectorAll('.aam-toggle, .aam-robot-open').forEach(button => button.setAttribute('aria-expanded', expanded));
        return;
      }
      if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
      const targets = Array.from(product.querySelectorAll('.aam-open, .aam-action, .aam-answer input')).filter(element => !element.disabled && element.getClientRects().length && getComputedStyle(element).visibility !== 'hidden' && !element.closest('[hidden]'));
      const current = targets.indexOf(event.target);
      const next = Math.max(0, Math.min(targets.length - 1, current + (event.key === 'ArrowDown' ? 1 : -1)));
      if (targets[next]) { event.preventDefault(); targets[next].focus({preventScroll:true}); targets[next].scrollIntoView({block:'nearest',inline:'nearest'}); }
    });
    recount();
    const tuning = {rowHeight:36, messageSize:13, showMetadata:true};
    function tune() {
      stage.style.setProperty('--aam-row', tuning.rowHeight + 'px');
      stage.style.setProperty('--aam-body-size', tuning.messageSize + 'px');
      product.querySelectorAll('.aam-meta').forEach(meta => meta.hidden = !tuning.showMetadata);
      product.querySelector('.aam-show-meta').checked = tuning.showMetadata;
    }
    if (globalThis.Tweak) {
      const tweak = new Tweak({container: product, onChange: tune});
      tweak.addSlider(tuning, 'rowHeight', {label:'Высота строки', min:28, max:42, step:2, unit:'px'});
      tweak.addSlider(tuning, 'messageSize', {label:'Размер сообщения', min:12, max:15, unit:'px'});
      tweak.addToggle(tuning, 'showMetadata', {label:'Каталог и ветка'});
    }
  }
  root.querySelectorAll('.aam-stage').forEach(build);
  applyExpanded(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) applyExpanded(event.detail.globals.widgetState);
  });
  if (globalThis.lucide) lucide.createIcons({attrs: {width:16,height:16}});
})();
</script>
