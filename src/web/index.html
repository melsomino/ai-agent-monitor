</template><script src="settings.js?v=20261115-update-flame"></script><script src="monitor.js?v=20261115-update-flame"></script><script>
(() => {
 const send=message=>{
  if(window.parent!==window)window.parent.postMessage({channel:'aam-monitor',message},'*');
 };
 window.aam=window.AAMMonitor.mount(document.getElementById('aam-ui-preview'),send);
 window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data?.channel!=='aam-host')return;
  if(event.data.snapshot)window.aam.setSnapshot(event.data.snapshot);
  if(event.data.visibility!==undefined)window.aam.visibility(event.data.visibility,event.data.focusSession);
 });
 send({type:'ready'});
})();
